      summary: Delete a user account and end its sessions (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Deleted, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "Your own account, or the last account with admin", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
