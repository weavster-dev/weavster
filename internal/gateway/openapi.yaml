        "200": {description: "The saved code snippets", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Snippet"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad or repeated name, an unknown field, or not a JSON array", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "A named library does not exist", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Body larger than 10 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/snippets/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
