  /api/v1/users:
    get:
      summary: List user accounts (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "[{username, email, org, permissions, mustChangePassword, locked}]", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    post:
      summary: Create a user account; by default the user must change the password at first login (requires users:admin)
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/NewUser"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: The new account, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Invalid username, unknown permission, or a password the policy rejects", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: The username is taken, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/users/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: One user account (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{username, email, org, permissions, mustChangePassword, locked}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
