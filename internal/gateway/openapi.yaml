        "400": {description: "A bad name or an unknown field", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "The named library does not exist", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
