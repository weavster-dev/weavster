openapi: 3.1.0
info:
  title: Weavster API
  version: 0.1.0
  description: >
    REST API for the Weavster message-oriented integration platform.
    Errors use the JSON error envelope (components.schemas.Error).
    API responses (not message content) are also available as XML: send Accept
    application/xml, ranked above JSON and every other listed type. The mapping is described in the user docs (JSON and
    XML); request bodies are JSON only.
    Every /api/v1 path is also served unversioned (/api/flows), resolving to
    the latest version; replies carry Weavster-API-Version.
paths:
  /api/openapi.yaml:
    get:
      summary: This OpenAPI contract (no authentication)
      security: []
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The contract as YAML.
          content:
            application/yaml:
              schema: {type: string}
  /api/v1/auth/login:
    post:
      summary: Log in and receive a bearer token (valid 12 hours)
      security:
        - csrfMarker: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"username": "admin", "password": "A-Strong-Passw0rd"}
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
                mfaCode: {type: string, description: "Accepted and ignored: this edition has no multi-factor authentication"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Token, expiresAt, and user", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}
        "401": {description: Invalid username or password, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/auth/logout:
    post:
      summary: Revoke the bearer token used for this request
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Logged out, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/auth/me:
    get:
      summary: Current user, permissions, and whether a password change is required
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: Current user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
  /api/v1/auth/password:
    post:
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: {type: string}
                newPassword: {type: string}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Password changed, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: New password rejected by the password policy, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/auth/password/check:
    post:
      summary: Check a candidate password against the password policy without setting it (any signed-in user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
            example: {"password": "Candidate-Passw0rd"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Whether the policy accepts it, and why not
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: {type: boolean}
                  reason: {type: string, description: Why the policy rejects it (only when valid is false)}
              example: {"valid": false, "reason": "password shorter than 8 characters"}
        "400": {description: The body is not JSON with password, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system:
    get:
      summary: "System status, computed per request: version, time, uptime, and TLS as configured (any signed-in user)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SystemStatus"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: System information unavailable, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/about:
    get:
      summary: "Product name, version, build, runtime, and license (any signed-in user)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SystemAbout"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: System information unavailable, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/password-requirements:
    get:
      summary: "The password policy: counts (0 = none, -1 forbids the class) and the same rules in words (any signed-in user)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordRequirements"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: System information unavailable, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/resources:
    get:
      summary: "The server process: CPUs, goroutines, memory, uptime (any signed-in user)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SystemResources"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: System information unavailable, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/guid:
    get:
      summary: "A new random (version 4) UUID (any signed-in user)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{guid}", content: {application/json: {schema: {type: object, properties: {guid: {type: string, format: uuid}}}, example: {"guid": "2f1c6b0e-5c2a-4b7e-9a41-7d3b1f0e8c55"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /metrics:
    get:
      summary: "Prometheus metrics: messages by flow, connector, and outcome; flows by status; processing slots (requires flows:view; no CSRF marker needed)"
      security: [{basicAuth: []}, {bearerAuth: []}]
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: Prometheus text exposition format, content: {text/plain: {schema: {type: string}, example: "weavster_flow_messages_total{flow=\"adt\",outcome=\"sent\"} 120\n"}}}
        "401": {description: Missing or wrong credentials}
        "403": {description: The user lacks flows:view}
  /api/v1/system/prune:
    get:
      summary: "Message pruning: the configured limits, whether a pass is running, the last pass, and the next (requires messages:view)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The prune status, content: {application/json: {schema: {$ref: "#/components/schemas/PruneStatus"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: No message store, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/prune/start:
    post:
      summary: "Run a prune pass now, in the background (requires messages:delete)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {description: "Started; the prune status", content: {application/json: {schema: {$ref: "#/components/schemas/PruneStatus"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "A pass is already running, or pruning is not configured (no prune.maxAgeHours or prune.maxMessages)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: "No message store, or the server is starting or shutting down", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/system/prune/stop:
    post:
      summary: "Stop the running prune pass; the reply comes once it has stopped (requires messages:delete)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Stopped; the prune status (lastRun.stopped is true)", content: {application/json: {schema: {$ref: "#/components/schemas/PruneStatus"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: No pass is running, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: No message store, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/topology:
    get:
      summary: Flow topology overview graph (read-only; requires flows:view)
      description: "Every flow as a flow:<id> node, with route and dependency edges. The JSON Schema is agent-docs/schemas/topology.schema.json."
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {$ref: "#/components/schemas/TopologyGraph"}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Overview graph (flow nodes + route/dependency edges).
  /api/v1/topology/flows/{flowId}:
    get:
      summary: Flow-internal topology graph (read-only; requires flows:view)
      description: "The flow's source (source:<type>), transform (transform:dsl:<name>), and destinations (destination:<name>) with message-path edges, and a route edge from each flow destination to flow:<target>. The JSON Schema is agent-docs/schemas/topology.schema.json."
      parameters:
        - name: flowId
          in: path
          required: true
          description: The flow id, with or without the flow prefix (adt or flow:adt)
          schema:
            type: string
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {$ref: "#/components/schemas/TopologyGraph"}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Flow-internal graph (source -> transform -> destination nodes + message-path edges).
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows:
    get:
      summary: List flows
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Flow"}}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Flow list.
    post:
      summary: Create a flow, undeployed (requires flows:edit)
      requestBody:
        required: true
        content:
          application/json:
            example: {"id": "adt", "name": "ADT inbound", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}
            schema: {type: object, description: "A flow definition (agent-docs/schemas/flow.schema.json)"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201":
          content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Created.
        "400":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: The definition is invalid (schema, transform, destinations, or dependencies).
        "409":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: A flow with this id already exists.
    put:
      summary: Replace several flow definitions; each keeps its status, stopped destinations, and (unless set) enabled (requires flows:edit)
      requestBody:
        required: true
        content:
          application/json:
            example: {"flows": [{"id": "adt", "name": "ADT inbound", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}]}
            schema:
              type: object
              description: "{flows: [flow definitions]}; no other top-level field"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {$ref: "#/components/schemas/UpdatedList"}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: "{updated: [ids]}"
        "400":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Invalid document, flow, or dependencies; nothing written.
        "404":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Unknown flows (listed); nothing written.
        "413":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Document larger than 50 MiB.
        "500":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: "Stopped part-way: {error: {code: UPDATE_INCOMPLETE}, updated: [ids]} lists what was written."
  /api/v1/flows/connector-names:
    get:
      summary: List every flow's source type and destination names (requires flows:view)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ConnectorNames"}}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: "[{id, name, sourceType, destinations: [names]}]"
  /api/v1/flows/ports-in-use:
    get:
      summary: List the ports the server listens on (requires flows:view)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/PortInUse"}}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: "[{address, port, usedBy}]"
  /api/v1/flows/{id}:
    put:
      summary: Replace a flow's definition; status is kept (requires flows:edit)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            example: {"id": "adt", "name": "ADT inbound", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}
            schema: {type: object}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The updated flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}}
        "400": {description: "Invalid definition, a status field, or a different id in the body", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    get:
      summary: Get a flow (requires flows:view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Flow record.
        "404":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Unknown flow.
    delete:
      summary: Delete a flow (requires flows:edit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Deleted.
        "404":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Unknown flow.
        "409":
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          description: Other flows depend on this flow.
  /api/v1/flows/{id}/enable:
    post:
      summary: Make a flow eligible for auto-deploy at startup (requires flows:edit)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The updated flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/{id}/disable:
    post:
      summary: Remove a flow's auto-deploy eligibility (requires flows:edit)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The updated flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/{id}/destinations/{dest}/{action}:
    post:
      summary: Stop (hold deliveries to) or start one destination of a flow (requires flows:deploy)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: dest, in: path, required: true, description: Destination name, schema: {type: string}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop]}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The flow; stoppedDestinations lists stopped destinations", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}}
        "404": {description: "Unknown flow, destination, or action", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/{id}/{action}:
    post:
      summary: Change a flow's lifecycle state (requires flows:deploy)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [deploy, undeploy, start, stop, pause, halt, resume]}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The updated flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Flow"}}}}
        "404": {description: Unknown flow or action, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "Transition not allowed from the flow's status", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/export:
    get:
      summary: Export flow definitions plus their transitive dependencies (requires flows:view)
      parameters:
        - name: ids
          in: query
          description: Comma-separated flow ids; omit for all flows
          schema: {type: string}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{version: 1, flows: [definitions without status]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/FlowBundle"}}}}
        "404": {description: Unknown flow id, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/import:
    post:
      summary: Import an export document, validated as a whole before writing (requires flows:edit)
      parameters:
        - name: overwrite
          in: query
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{created: [ids], updated: [ids]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/FlowImportResult"}}}}
        "400": {description: "Invalid document, flow, or dependencies; nothing written", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: Flows already exist and overwrite is not set; nothing written, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Document larger than 50 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "500": {description: "Stopped part-way: {error: {code: IMPORT_INCOMPLETE}, created: [ids], updated: [ids]} lists what was written", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/redeploy-all:
    post:
      summary: Undeploy and re-deploy every flow that is not undeployed (deployed, started, paused, halted, stopped); each ends deployed (requires flows:deploy)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The redeployed flows, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Flow"}}}}}
        "500": {description: "Stopped part-way: {error: {code: REDEPLOY_INCOMPLETE}, redeployed: [flows already redeployed]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/deploy-all:
    post:
      summary: "Deploy every flow the action applies to, dependencies first; flows it does not apply to are skipped with the reason. Disabled flows are skipped. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/undeploy-all:
    post:
      summary: "Undeploy every flow the action applies to, dependents first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/start-all:
    post:
      summary: "Start every flow the action applies to, dependencies first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/stop-all:
    post:
      summary: "Stop every flow the action applies to, dependents first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/pause-all:
    post:
      summary: "Pause every flow the action applies to, dependents first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/halt-all:
    post:
      summary: "Halt every flow the action applies to, dependents first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/resume-all:
    post:
      summary: "Resume every flow the action applies to, dependencies first; flows it does not apply to are skipped with the reason. (requires flows:deploy)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{changed: [ids], skipped: [{id, reason}]}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/TransitionAllResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: TRANSITION_INCOMPLETE}, changed, skipped}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/stats:
    get:
      summary: Statistics of every flow, by flow id (requires flows:view)
      parameters:
        - {name: lifetime, in: query, schema: {type: boolean}, description: Lifetime totals instead of current counters}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{<flow id>: statistics}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/FlowStatsMap"}}}}
        "400": {description: lifetime is not true or false, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/stats/series:
    get:
      summary: "Sampled lifetime statistics of every flow (or one), oldest first (requires flows:view)"
      description: >
        The server samples every flow's lifetime counters when it starts and every
        stats.sampleIntervalMs, and keeps the samples for stats.retentionHours (server
        configuration; at most 1,000,000 samples in total, oldest dropped first). Samples are kept
        in memory and start again after a restart; a deleted flow's samples are dropped.
      parameters:
        - {name: flowId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Samples taken at or after this time (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Samples taken at or before this time (RFC 3339)}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1000}, description: The newest N matching samples}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The samples, oldest first
          content:
            application/json:
              example: [{"at": "2026-09-27T10:00:30Z", "flowId": "adt", "stats": {"received": 42, "filtered": 2, "transformed": 40, "sent": 39, "errored": 1, "queued": 0, "destinations": {"ehr": {"sent": 39, "errored": 1}}, "lastMessageAt": "2026-09-27T10:00:00Z"}}]
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: {type: string, format: date-time}
                    flowId: {type: string}
                    stats: {type: object, description: "The flow's lifetime statistics at that time (same shape as GET /api/v1/flows/{id}/stats)"}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
        "400": {description: "A bad from/to, from after to, or a limit outside 1-10000", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: flowId names no flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/stats/reset:
    post:
      summary: Clear every flow's current statistics; with lifetime=true also the lifetime totals (requires flows:deploy)
      parameters:
        - {name: lifetime, in: query, schema: {type: boolean}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Cleared, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: lifetime is not true or false, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/{id}/stats/reset:
    post:
      summary: Clear one flow's current statistics; with lifetime=true also its lifetime totals (requires flows:deploy)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: lifetime, in: query, schema: {type: boolean}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Cleared, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: lifetime is not true or false, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/flows/{id}/messages:
    post:
      summary: Send a message into a flow (requires messages:send)
      description: >
        Persists the message, runs the flow's transform, and delivers it to each destination.
        The body must be a single JSON object when the flow has a transform; passthrough
        flows (no transform) accept any bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            example: {"patientId": "12345", "event": "A01"}
            schema: {type: object}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {description: "Processed: {id, status, response?} with status sent, queued, dead-lettered, filtered, or errored; response is the responseSelector destination's reply. Also when a later step failed after the message was stored (status received): the server finishes it, so do not send it again", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/IngestResult"}}}}
        "400": {description: "The flow or a destination has a transform (a responseTransform does not count) and the body is not a single JSON object, or the body could not be read", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: The flow is not started, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Body larger than 10 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: "The server is busy: processing.maxConcurrent messages are being processed and none finished within processing.waitMs (Retry-After: 1); send it again shortly", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}, Retry-After: {schema: {type: integer}, description: "Seconds to wait before sending again"}}}
  /api/v1/flows/{id}/stats:
    get:
      summary: Flow message counters (requires flows:view)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: lifetime
          in: query
          schema: {type: boolean}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "received, filtered, transformed, sent, errored, queued, destinations, lastMessageAt", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/FlowStats"}}}}
        "400": {description: lifetime is not a boolean, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/audit:
    get:
      summary: "Stored audit entries at least 3 seconds old, oldest first; audit.read entries only with action=audit.read (requires audit:view; a read that returns entries is audited as audit.read)"
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}, description: "For example phi.access, auth.failure, POST /api/v1/flows"}
        - {name: resource, in: query, schema: {type: string}, description: The request path}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: At or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: At or before (RFC 3339)}
        - {name: afterId, in: query, schema: {type: integer, minimum: 0}, description: Only entries with a larger id}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The entries, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: A bad parameter, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: The audit log is unavailable, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/events:
    get:
      summary: Search the event log (requires events:view)
      parameters:
        - name: type
          in: query
          schema: {type: string}
        - name: flowId
          in: query
          schema: {type: string}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: At or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: At or before (RFC 3339)}
        - {name: afterId, in: query, schema: {type: integer, minimum: 0}, description: "Only events with a larger id: poll with the last id you saw"}
        - name: limit
          in: query
          description: Newest N matching events (1-10000, default 1000)
          schema: {type: integer, minimum: 1, maximum: 10000}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Events, oldest first", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Event"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad time, afterId, or limit", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/events/count:
    get:
      summary: Count the matching events (requires events:view)
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: flowId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: At or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: At or before (RFC 3339)}
        - {name: afterId, in: query, schema: {type: integer, minimum: 0}, description: Only events with a larger id}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{count}", content: {application/json: {schema: {type: object, properties: {count: {type: integer}}}, example: {"count": 1287}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad time or afterId", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/events/max-id:
    get:
      summary: The id of the newest event, 0 when there is none (requires events:view)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{maxId}", content: {application/json: {schema: {type: object, properties: {maxId: {type: integer}}}, example: {"maxId": 1287}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/events/export:
    get:
      summary: "Every matching event (no limit) as a JSON (or, when XML is asked for, XML) file download, oldest first (requires events:view)"
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: flowId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: At or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: At or before (RFC 3339)}
        - {name: afterId, in: query, schema: {type: integer, minimum: 0}, description: Only events with a larger id}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Events (Content-Disposition: attachment; filename=events.json, or events.xml when served as XML)", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Event"}}}, application/xml: {schema: {type: object, description: "The same events in the documented JSON-to-XML mapping"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad time or afterId", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/events/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: The event id (a positive number)}
    get:
      summary: One event (requires events:view)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The event, content: {application/json: {schema: {$ref: "#/components/schemas/Event"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: The id is not a positive number, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown, or older than the events kept", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages:
    get:
      summary: Search stored messages, newest first by default (requires messages:view; audited)
      description: "X-Total-Count gives the number of matches without limit and offset. Filter by metadata with metadata.KEY=VALUE (for example metadata.source.file=a.hl7), up to 10, each given once; every one must match."
      parameters:
        - {name: flowId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}, description: "received, transformed, queued, sent, filtered, errored, or dead-lettered"}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Received at or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Received at or before (RFC 3339)}
        - {name: idFrom, in: query, schema: {type: string}, description: Message id at or after (byte order)}
        - {name: idTo, in: query, schema: {type: string}, description: Message id at or before (byte order)}
        - {name: contentType, in: query, schema: {type: string}, description: "The message's format, as its contentType shows (for example raw, hl7v2)"}
        - {name: minAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at least this many attempts}
        - {name: maxAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at most this many attempts}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: sort, in: query, schema: {type: string, enum: [-receivedAt, receivedAt, id, -id], default: -receivedAt}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "[{id, flowId, status, contentType, receivedAt, updatedAt, attempts, metadata}]", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}, X-Total-Count: {description: "Messages matching the filters, without limit and offset (counted separately from the page; absent when the count failed)", schema: {type: integer}}}, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Message"}}}}}
        "400": {description: A filter or paging parameter is invalid, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Remove every message matching the filters; all=true is required when no filter is given (requires messages:delete)"
      description: "The search filters apply. Filter by metadata with metadata.KEY=VALUE (for example metadata.source.file=a.hl7), up to 10, each given once; every one must match."
      parameters:
        - {name: flowId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Received at or after (RFC 3339)}
        - {name: to, in: query, schema: {type: string, format: date-time}, description: Received at or before (RFC 3339)}
        - {name: idFrom, in: query, schema: {type: string}, description: Message id at or after (byte order)}
        - {name: idTo, in: query, schema: {type: string}, description: Message id at or before (byte order)}
        - {name: contentType, in: query, schema: {type: string}, description: "The message's format, as its contentType shows (for example raw, hl7v2)"}
        - {name: minAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at least this many attempts}
        - {name: maxAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at most this many attempts}
        - {name: all, in: query, schema: {type: boolean}, description: Remove every message (needed when no filter is given)}
        - {name: restart, in: query, schema: {type: boolean}, description: "Stop the started flows in scope first, and start them again afterwards"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Removed", content: {application/json: {schema: {$ref: "#/components/schemas/MessagesDeleted"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "No filter without all=true, a bad filter, or limit/offset/sort given", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "500": {description: "Removal stopped part-way (the message says how many were removed), or flows it stopped did not start again (the message names them)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "A flow could not be stopped (restart=true); nothing was removed", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/trends:
    get:
      summary: "Messages received per time bucket, by current status; empty buckets included (requires messages:view)"
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}, description: Start of the first bucket (RFC 3339)}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}, description: "End of the range, not included; the last bucket may be shorter"}
        - {name: interval, in: query, schema: {type: string, enum: [hour, day], default: hour}}
        - {name: flowId, in: query, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: One bucket per interval from from to to (at most 1000)
          content:
            application/json:
              example: [{"start": "2026-09-27T10:00:00Z", "total": 40, "statuses": {"received": 0, "transformed": 0, "queued": 0, "sent": 38, "filtered": 1, "errored": 1, "dead-lettered": 0}}, {"start": "2026-09-27T11:00:00Z", "total": 2, "statuses": {"received": 0, "transformed": 0, "queued": 0, "sent": 2, "filtered": 0, "errored": 0, "dead-lettered": 0}}]
              schema:
                type: array
                items:
                  type: object
                  properties:
                    start: {type: string, format: date-time}
                    total: {type: integer}
                    statuses: {type: object, additionalProperties: {type: integer}, description: "Every status (received, transformed, queued, sent, filtered, errored, dead-lettered) with its count"}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
        "404": {description: flowId names no flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Missing or bad from/to, a bad interval, or more than 1000 buckets", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/configmap:
    get:
      summary: "Every config map entry, as a JSON object of name: value (requires configmap:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name: value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
    put:
      summary: "Replace every config map entry with the body, a JSON object of name: value; each value is a string (requires configmap:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}, example: {"region": "eu"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The new set, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
        "400": {description: "A bad name, a wrong value type, or not a JSON object", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Body larger than 10 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/configmap/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "One config map entry: {name, value} (requires configmap:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: "Create or replace one config map entry; the body is {\"value\": ...} with a string (requires configmap:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [value], properties: {value: {}}}, example: {"value": "eu"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: "A bad name, a missing value, or a wrong value type", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete one config map entry (requires configmap:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Deleted, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/scripts:
    get:
      summary: "Every script, as a JSON object of name: value (requires scripts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name: value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
    put:
      summary: "Replace every script with the body, a JSON object of name: value; each value is a string (the script source) (requires scripts:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The new set, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
        "400": {description: "A bad name, a wrong value type, or not a JSON object", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Body larger than 10 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/scripts/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "One script: {name, value} (requires scripts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: "Create or replace one script; the body is {\"value\": ...} with a string (the script source) (requires scripts:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [value], properties: {value: {}}}, example: {"value": "log()"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: "A bad name, a missing value, or a wrong value type", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete one script (requires scripts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Deleted, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/settings:
    get:
      summary: "Every setting, as a JSON object of name: value (requires settings:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name: value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
    put:
      summary: "Replace every setting with the body, a JSON object of name: value; each value is any JSON value (requires settings:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The new set, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ItemMap"}}}}
        "400": {description: "A bad name, a wrong value type, or not a JSON object", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Body larger than 10 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/settings/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "One setting: {name, value} (requires settings:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: "Create or replace one setting; the body is {\"value\": ...} with any JSON value (requires settings:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [value], properties: {value: {}}}, example: {"value": {"days": 30}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{name, value}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Item"}}}}
        "400": {description: "A bad name, a missing value, or a wrong value type", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete one setting (requires settings:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Deleted, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: A bad name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown name, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/config/validate:
    post:
      summary: "Check a config-as-code document (YAML or JSON) without changing anything (requires flows:edit)"
      requestBody:
        required: true
        content:
          application/yaml: {schema: {type: string}}
          application/json: {schema: {type: object}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Valid: {valid: true, counts}", content: {application/json: {schema: {$ref: "#/components/schemas/ConfigValidation"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Invalid: the message names every problem", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Document larger than 50 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/config/apply:
    post:
      summary: "Apply a config-as-code document: re-plans, refuses a stale fingerprint, applies the changes, and rolls every applied change back if one fails (requires flows:view, flows:edit, alerts:edit, snippets:edit, scripts:edit, settings:edit, configmap:edit)"
      parameters:
        - {name: fingerprint, in: query, required: true, schema: {type: string}, description: The fingerprint of the plan you reviewed}
        - {name: dryRun, in: query, schema: {type: boolean}, description: Check that the plan is current without changing anything}
        - {name: reason, in: query, schema: {type: string, maxLength: 500}, description: Recorded in the audit log}
      requestBody:
        required: true
        content:
          application/yaml: {schema: {type: string}}
          application/json: {schema: {type: object}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{applied, plan}", content: {application/json: {schema: {type: object, properties: {applied: {type: boolean}, plan: {$ref: "#/components/schemas/ConfigPlan"}}}, example: {"applied": true, "plan": {"fingerprint": "3f9b1c7e0d4a2f6b8c5e1a9d7b3f0c2e4a6d8b1f3c5e7a9b0d2f4c6e8a1b3d5f", "added": ["script/deploy"], "updated": [], "removed": [], "unchanged": 7, "changes": [{"key": "script/deploy", "action": "add", "after": "log()"}], "text": "+ script/deploy\n1 to add, 0 to change, 0 to remove, 7 unchanged\n"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Missing fingerprint, a bad parameter, or an invalid document", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "The plan is stale, or a change failed because of the configuration (every applied change was rolled back)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Document larger than 50 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "500": {description: "A change failed because of the server (rolled back), or rolling back failed (partly applied)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/config/plan:
    post:
      summary: "What applying a config-as-code document (YAML or JSON) would change on the server; nothing is written. Sections the document leaves out are not managed (requires flows:view, alerts:edit, snippets:edit, scripts:edit, settings:edit, configmap:edit)"
      requestBody:
        required: true
        content:
          application/yaml: {schema: {type: string}}
          application/json: {schema: {type: object}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The plan", content: {application/json: {schema: {$ref: "#/components/schemas/ConfigPlan"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Invalid document: the message names every problem", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Document larger than 50 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/config/export:
    get:
      summary: "The full configuration: flows, alerts, snippets, snippet libraries, global scripts, settings, and optionally the config map; never users (requires flows:view, alerts:edit, snippets:edit, scripts:edit, settings:edit; configmap:edit with includeConfigMap)"
      parameters:
        - {name: includeConfigMap, in: query, schema: {type: boolean}, description: Include the config map}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The configuration document", content: {application/json: {schema: {$ref: "#/components/schemas/ConfigBundle"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad parameter", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/config/import:
    post:
      summary: "Restore a configuration document; everything is validated and checked for conflicts before anything is written (requires flows:edit, alerts:edit, snippets:edit, scripts:edit, settings:edit; flows:deploy unless nodeploy; configmap:edit with overwriteConfigMap)"
      parameters:
        - {name: force, in: query, schema: {type: boolean}, description: "Replace flows, alerts, snippets, and libraries that already exist"}
        - {name: nodeploy, in: query, schema: {type: boolean}, description: Leave imported flows undeployed}
        - {name: overwriteConfigMap, in: query, schema: {type: boolean}, description: "Replace the config map with the document's (otherwise it is kept)"}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/ConfigBundle"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "What was imported", content: {application/json: {schema: {$ref: "#/components/schemas/ConfigImportResult"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "An invalid document, snippets naming missing libraries, or overwriteConfigMap without a configmap object", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "Items that already exist (without force; the message lists them), or were created or deleted by others during the import", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Document larger than 50 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "500": {description: "Import stopped part-way, or a flow did not deploy (the message says which)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups:
    get:
      summary: "Every lookup group with its number of entries (requires lookups:view)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "Groups sorted by name", content: {application/json: {schema: {type: array, items: {type: object, properties: {name: {type: string}, entries: {type: integer}}}}, example: [{"name": "icd10", "entries": 72184}, {"name": "sites", "entries": 12}]}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups/{group}:
    parameters:
      - {name: group, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "The group's entries whose key starts with prefix, first in key order (requires lookups:view)"
      parameters:
        - {name: prefix, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1000}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{key: value}", content: {application/json: {schema: {type: object, additionalProperties: {type: string}}, example: {"A00": "Cholera", "A00.0": "Cholera due to Vibrio cholerae 01, biovar cholerae"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name or limit", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete every entry of the group (requires lookups:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: "Deleted", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "The group has no entries", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups/{group}/import:
    parameters:
      - {name: group, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    post:
      summary: "Store entries (a JSON object of key: text), all or nothing; replace=true makes them the whole group (requires lookups:edit)"
      parameters:
        - {name: replace, in: query, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, additionalProperties: {type: string}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{imported}", content: {application/json: {schema: {type: object, properties: {imported: {type: integer}}}, example: {"imported": 72184}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad key or value, or not a JSON object of text", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Body larger than 50 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups/{group}/batch:
    parameters:
      - {name: group, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    post:
      summary: "Look up many keys at once, 1-1000 (requires lookups:view)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [keys], properties: {keys: {type: array, minItems: 1, maxItems: 1000, items: {type: string}}}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{found, missing}", content: {application/json: {schema: {type: object, properties: {found: {type: object, additionalProperties: {type: string}}, missing: {type: array, items: {type: string}}}}, example: {"found": {"A00": "Cholera"}, "missing": ["Z99.9"]}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "No keys or too many", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups/{group}/{key}:
    parameters:
      - {name: group, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
      - {name: key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 512}, description: "Any text without control characters (URL-encoded)"}
    get:
      summary: "One entry (requires lookups:view)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{key, value}", content: {application/json: {schema: {type: object, properties: {key: {type: string}, value: {type: string}}}, example: {"key": "A00", "value": "Cholera"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name or key", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown key", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: "Create or replace one entry; the body is {value: text} (requires lookups:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [value], properties: {value: {type: string, description: "UTF-8 text of at most 64 KiB (65536 bytes)"}}}, example: {"value": "Cholera"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{key, value}", content: {application/json: {schema: {type: object, properties: {key: {type: string}, value: {type: string}}}, example: {"key": "A00", "value": "Cholera"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name, key, or value", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete one entry (requires lookups:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: "Deleted", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name or key", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown key", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/lookups/{group}/{key}/exists:
    parameters:
      - {name: group, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
      - {name: key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 512}, description: "Any text without control characters (URL-encoded)"}
    get:
      summary: "Whether the key exists: {exists: true|false} (requires lookups:view)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{exists}", content: {application/json: {schema: {type: object, properties: {exists: {type: boolean}}}, example: {"exists": true}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad group name or key", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts:
    get:
      summary: "Every alert definition, sorted by id (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The alerts", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    post:
      summary: "Create one alert (requires alerts:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/Alert"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: "Created", content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "An invalid alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "An alert with that id already exists", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/import:
    post:
      summary: "Save several alerts, all or nothing; without force=true an existing id is a conflict (requires alerts:edit)"
      parameters:
        - {name: force, in: query, schema: {type: boolean}, description: Replace alerts with the same id}
      requestBody:
        required: true
        content:
          application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The saved alerts", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "An invalid alert or not a JSON array", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "An alert with one of the ids already exists (without force)", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: "Body larger than 10 MiB", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/options:
    get:
      summary: "The trigger events and action types an alert can use (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{events, actionTypes}", content: {application/json: {schema: {type: object, properties: {events: {type: array, items: {type: string}}, actionTypes: {type: array, items: {type: string}}}}, example: {"events": ["message.errored", "message.queued", "message.dead-lettered"], "actionTypes": ["email", "webhook"]}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/statuses:
    get:
      summary: "Every alert's id, name, and whether it is enabled, sorted by id (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The alert statuses
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, enabled]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    enabled: {type: boolean}
              example: [{"id": "adt-errors", "name": "ADT errors", "enabled": true}]
  /api/v1/alerts/{name}:
    parameters:
      - {name: name, in: path, required: true, description: The alert id, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "One alert (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The alert", content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: "Create or replace one alert; id in the body is optional and must match the path (requires alerts:edit)"
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/AlertUpdate"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The saved alert", content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "An invalid alert or a bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: "Delete one alert (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: "Deleted", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/{name}/info:
    parameters:
      - {name: name, in: path, required: true, description: The alert id, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    get:
      summary: "One alert with the trigger events and action types it may use (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: "{alert, events, actionTypes}"
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/json:
              schema:
                type: object
                required: [alert, events, actionTypes]
                properties:
                  alert: {$ref: "#/components/schemas/Alert"}
                  events: {type: array, items: {type: string}}
                  actionTypes: {type: array, items: {type: string}}
              example: {"alert": {"id": "adt-errors", "name": "ADT errors", "enabled": true, "trigger": {"events": ["message.errored"], "flows": ["adt"]}, "actions": [{"type": "email", "to": ["ops@example.com"]}]}, "events": ["message.errored", "message.queued", "message.dead-lettered"], "actionTypes": ["email", "webhook"]}
        "400": {description: "A bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/{name}/test:
    parameters:
      - {name: name, in: path, required: true, description: The alert id, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    post:
      summary: "Dry run: would an event of a flow trigger this alert, and which actions would run (requires alerts:edit). Nothing is sent."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                event: {type: string, description: "A trigger event; default the alert's first"}
                flowId: {type: string, description: "A flow id; default the alert's first flow"}
            example: {"event": "message.errored", "flowId": "adt"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The result of the dry run
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/json:
              schema:
                type: object
                required: [matches, enabled, event, actions, delivered]
                properties:
                  matches: {type: boolean, description: The event and flow match the trigger}
                  enabled: {type: boolean, description: "Whether the alert is enabled; when false, matches and actions show what it would do once enabled"}
                  event: {type: string}
                  flowId: {type: string}
                  actions: {type: array, items: {$ref: "#/components/schemas/AlertAction"}, description: The actions that would run (none when it does not match)}
                  delivered: {type: boolean, description: Always false; this release sends no notifications}
              example: {"matches": true, "enabled": true, "event": "message.errored", "flowId": "adt", "actions": [{"type": "email", "to": ["ops@example.com"]}], "delivered": false}
        "400": {description: "A bad id, an unknown event, or a bad flow id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/{name}/enable:
    parameters:
      - {name: name, in: path, required: true, description: The alert id, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    post:
      summary: "Enable one alert (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The alert", content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/alerts/{name}/disable:
    parameters:
      - {name: name, in: path, required: true, description: The alert id, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
    post:
      summary: "Disable one alert (requires alerts:edit)"
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The alert", content: {application/json: {schema: {$ref: "#/components/schemas/Alert"}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "A bad id", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: "Unknown alert", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/snippets:
    get:
      summary: "Every code snippet, sorted by name (requires snippets:edit)"
      parameters:
        - {name: summary, in: query, required: false, description: "true omits the code", schema: {type: boolean}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The code snippets", content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Snippet"}}}}, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    post:
