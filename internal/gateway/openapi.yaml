  /api/v1/users:
    get:
      summary: List user accounts (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "[{username, email, org, permissions, mustChangePassword, locked}]", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/UserInfo"}}}}}
    post:
      summary: Create a user account; by default the user must change the password at first login (requires users:admin)
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/NewUser"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: The new account, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/UserInfo"}}}}
        "400": {description: "Invalid username, unknown permission, or a password the policy rejects", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: The username is taken, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/users/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: One user account (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{username, email, org, permissions, mustChangePassword, locked}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/UserInfo"}}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: Replace a user's permissions, email, and org; ends the user's sessions (requires users:admin)
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/UserUpdate"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The updated account, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/UserInfo"}}}}
        "400": {description: Unknown permission or invalid JSON, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: It would remove admin from the last account that has it, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: Delete a user account and end its sessions (requires users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Deleted, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "Your own account, or the last account with admin", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/users/{name}/password:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    post:
      summary: Set a user's password; the user must change it at next login, a lockout is cleared, and the user's sessions end (requires users:admin)
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/PasswordSet"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Set, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: The password policy rejects the password, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/users/{name}/preferences:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: The user's preferences, name to text value (the user themselves, or users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "The preferences, {} when none", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Preferences"}}}}
        "403": {description: Another user's preferences without users:admin, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    put:
      summary: Replace the user's preferences (the user themselves, or users:admin; an account that has admin only by one that has admin)
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/Preferences"}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The stored preferences, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Preferences"}}}}
        "400": {description: "Not an object of text values, or over the limits", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "403": {description: "Another user's preferences without users:admin, or an admin's without admin", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/users/{name}/loggedin:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Whether the user has an active login session (the user themselves, or users:admin)
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Logged-in status
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/json:
              schema:
                type: object
                required: [loggedIn, sessions]
                properties:
                  loggedIn: {type: boolean}
                  sessions: {type: integer, description: How many active login sessions the user has}
              example: {"loggedIn": true, "sessions": 1}
        "403": {description: Another user without users:admin, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown user, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/export:
    get:
      summary: An archive of the complete messages matching the search filters (requires messages:content; audited)
      description: "Filter by metadata with metadata.KEY=VALUE (for example metadata.source.file=a.hl7), up to 10, each given once; every one must match."
      parameters:
        - {name: flowId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: idFrom, in: query, schema: {type: string}, description: Message id at or after (byte order)}
        - {name: idTo, in: query, schema: {type: string}, description: Message id at or before (byte order)}
        - {name: contentType, in: query, schema: {type: string}, description: "The message's format, as its contentType shows (for example raw, hl7v2)"}
        - {name: minAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at least this many attempts}
        - {name: maxAttempts, in: query, schema: {type: integer, minimum: 1, maximum: 1000}, description: Some destination took at most this many attempts}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 10000}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: sort, in: query, schema: {type: string, enum: [-receivedAt, receivedAt, id, -id], default: -receivedAt}}
        - {name: Weavster-Archive-Key, in: header, schema: {type: string}, description: "Optional AES-256-GCM key: base64 of 32 bytes"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The archive (application/gzip; application/octet-stream when encrypted).
          headers:
            Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}
            Weavster-Message-Count: {description: How many messages the archive holds (10000 means there may be more), schema: {type: integer}}
          content:
            application/gzip: {schema: {type: string, format: binary}}
            application/octet-stream: {schema: {type: string, format: binary}}
        "400": {description: "A filter or the key is invalid", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/import:
    post:
      summary: Restore an archive made by the export (requires messages:import)
      parameters:
        - {name: flowId, in: query, schema: {type: string}, description: Assign every message to this flow}
        - {name: overwrite, in: query, schema: {type: boolean}, description: Replace messages whose id exists (skipped otherwise)}
        - {name: Weavster-Archive-Key, in: header, schema: {type: string}, description: The key the archive was encrypted with}
      requestBody:
        required: true
        content:
          application/gzip: {schema: {type: string, format: binary}}
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{imported, skipped, busy}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/MessageImportResult"}}}}
        "500": {description: "Stopped part-way: {error: {code: IMPORT_INCOMPLETE}, imported, skipped, busy}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: "Not a readable archive (not gzip, wrong key, or not an export document), or a bad parameter", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: flowId names no flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "413": {description: Archive larger than 100 MiB, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/{id}:
    get:
      summary: One stored message, without its content (requires messages:view; audited)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: "{id, flowId, status, contentType, receivedAt, updatedAt, attempts, metadata}", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Message"}}}}
        "404": {description: Unknown message, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
    delete:
      summary: Remove a stored message (requires messages:delete)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [dead-lettered]}, description: "Remove only if the message is dead-lettered (checked while it is held; 409 otherwise)"}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "204": {description: Removed, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown message, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "The message is being processed or retried, or (with status=dead-lettered) is not dead-lettered", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "400": {description: status other than dead-lettered, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/{id}/content:
    get:
      summary: A stored part of a message, as bytes (requires messages:content; every access is audited)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: part, in: query, schema: {type: string, enum: [raw, transformed], default: raw}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The content (application/json for a transformed JSON message, otherwise application/octet-stream)
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
            application/json: {schema: {type: object}, example: {"patientId": "12345", "event": "A01"}}
        "400": {description: part is not raw or transformed, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown message, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/{id}/requeue:
    post:
      summary: "Give a dead-lettered message another round of delivery attempts (requires messages:view and messages:send; audited as PHI access)"
      description: >
        Destinations that did not deliver start again with no attempts; destinations that delivered
        are never sent again. The message becomes queued (received, if it was never transformed) and
        the retry loop delivers it. The attempts it had are returned; their counts (not the error
        texts) are recorded in the audit log and a message.requeued event.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The requeued message and the attempts it had
          content:
            application/json:
              example: {"message": {"id": "7f3c9a1e", "flowId": "adt", "status": "queued", "contentType": "json", "receivedAt": "2026-09-27T10:00:00Z", "updatedAt": "2026-09-27T11:00:00Z", "attempts": {"archive": {"attempts": 1}}, "metadata": {"requeues": "1"}}, "previous": {"archive": {"attempts": 1}, "ehr": {"attempts": 5, "lastError": "Service Unavailable"}}}
              schema:
                type: object
                properties:
                  message: {type: object, description: "As GET /api/v1/messages/{id}"}
                  previous: {type: object, additionalProperties: {type: object, properties: {attempts: {type: integer}, lastError: {type: string}}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
        "404": {description: "Unknown message, or its flow was deleted", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: "The message is not dead-lettered, or it is being processed", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/requeue:
    post:
      summary: "Requeue every dead-lettered message, or those of one flow (requires messages:send)"
      parameters:
        - {name: flowId, in: query, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: "The ids requeued, and those skipped with the reason (in flight, flow deleted)"
          content:
            application/json:
              example: {"requeued": ["7f3c9a1e", "8a01b2c3"], "skipped": [{"id": "9b12c4d5", "reason": "message is being processed; try again"}]}
              schema:
                type: object
                properties:
                  requeued: {type: array, items: {type: string}}
                  skipped: {type: array, items: {type: object, properties: {id: {type: string}, reason: {type: string}}}}
          headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}
        "404": {description: flowId names no flow, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
  /api/v1/messages/{id}/reprocess:
    post:
      summary: Run the message's original content through its flow again, as a new message with metadata reprocessedFrom (requires messages:send)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {description: "The new message: {id, status, response?}. Also when a later step failed after the new message was stored (status received): the server finishes it, so do not reprocess again", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}, content: {application/json: {schema: {$ref: "#/components/schemas/IngestResult"}}}}
        "400": {description: The flow now needs a JSON object and the content is not one, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "404": {description: Unknown message or its flow no longer exists, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "409": {description: The flow is not started, headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}}}
        "503": {description: "The server is busy: processing.maxConcurrent messages are being processed and none finished within processing.waitMs (Retry-After: 1); send it again shortly", headers: {Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}, Retry-After: {schema: {type: integer}, description: "Seconds to wait before sending again"}}}
security:
  - basicAuth: []
    csrfMarker: []
  - bearerAuth: []
    csrfMarker: []
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic, description: "HTTP Basic credentials of a user. An X-Weavster-MFA header (a one-time code) is accepted and ignored: this edition has no multi-factor authentication."}
    bearerAuth: {type: http, scheme: bearer}
    csrfMarker: {type: apiKey, in: header, name: X-Weavster-CSRF}
  schemas:
    Identity:
      example: {"username": "admin", "permissions": ["admin"], "mustChangePassword": false}
      type: object
      required: [username, permissions, mustChangePassword]
      properties:
        username: {type: string}
        permissions: {type: array, items: {type: string}}
        mustChangePassword: {type: boolean}
    LoginResponse:
      example: {"token": "4f7a1c9e2b8d0f3a6c5e7b9d1f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a", "expiresAt": "2026-09-27T18:00:00Z", "user": {"username": "admin", "permissions": ["admin"], "mustChangePassword": false}}
      type: object
      required: [token, expiresAt, user]
      properties:
        token: {type: string, description: Bearer token for later requests}
        expiresAt: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/Identity"}
    ItemMap:
      example: {"region": "eu", "ehr-host": "ehr.example.com"}
      type: object
      description: "Name -> value. Config map entries and scripts are strings; settings are any JSON."
      additionalProperties: {}
    Item:
      example: {"name": "region", "value": "eu"}
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {description: "A string for config map entries and scripts; any JSON for settings"}
    FlowSource:
      example: {"type": "file", "dir": "/var/lib/weavster/in/adt", "pattern": "*.json", "pollIntervalMs": 1000, "moveTo": "/var/lib/weavster/done/adt"}
      type: object
      description: "Where the flow receives messages on its own (see flow.schema.json): a file source takes dir, pattern, pollIntervalMs or schedule, moveTo, and recursive; an http source takes address, path, method, username with passwordEnv, certFile with keyFile, and readTimeoutMs; an mllp source takes address, certFile with keyFile, frameStart, frameEnd, and ackMode; a database source takes driver, dsnEnv, query, idColumn, update, pollIntervalMs or schedule, maxRows, and timeoutMs."
      required: [type]
      additionalProperties: false
      oneOf:
        - required: [dir]
          properties: {type: {enum: [file]}}
          not: {anyOf: [{required: [address]}, {required: [path]}, {required: [method]}, {required: [username]}, {required: [passwordEnv]}, {required: [certFile]}, {required: [keyFile]}, {required: [readTimeoutMs]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}, {required: [driver]}, {required: [dsnEnv]}, {required: [query]}, {required: [idColumn]}, {required: [update]}, {required: [maxRows]}, {required: [timeoutMs]}, {required: [pollIntervalMs, schedule]}]}
        - required: [address]
          properties: {type: {enum: [mllp]}}
          not:
            anyOf:
              - {required: [dir]}
              - {required: [pattern]}
              - {required: [pollIntervalMs]}
              - {required: [moveTo]}
              - {required: [recursive]}
              - {required: [path]}
              - {required: [method]}
              - {required: [username]}
              - {required: [passwordEnv]}
              - {required: [readTimeoutMs]}
              - {required: [schedule]}
              - {required: [driver]}
              - {required: [dsnEnv]}
              - {required: [query]}
              - {required: [idColumn]}
              - {required: [update]}
              - {required: [maxRows]}
              - {required: [timeoutMs]}
              - {required: [certFile], not: {required: [keyFile]}}
              - {required: [keyFile], not: {required: [certFile]}}
        - required: [driver, dsnEnv, query, idColumn, update]
          properties: {type: {enum: [database]}, pollIntervalMs: {minimum: 1000}}
          not: {anyOf: [{required: [dir]}, {required: [pattern]}, {required: [moveTo]}, {required: [recursive]}, {required: [address]}, {required: [path]}, {required: [method]}, {required: [username]}, {required: [passwordEnv]}, {required: [certFile]}, {required: [keyFile]}, {required: [readTimeoutMs]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}, {required: [pollIntervalMs, schedule]}]}
        - required: [address]
          properties: {type: {enum: [http]}}
          not:
            anyOf:
              - {required: [dir]}
              - {required: [pattern]}
              - {required: [pollIntervalMs]}
              - {required: [moveTo]}
              - {required: [recursive]}
              - {required: [frameStart]}
              - {required: [frameEnd]}
              - {required: [ackMode]}
              - {required: [schedule]}
              - {required: [driver]}
              - {required: [dsnEnv]}
              - {required: [query]}
              - {required: [idColumn]}
              - {required: [update]}
              - {required: [maxRows]}
              - {required: [timeoutMs]}
              - {required: [username], not: {required: [passwordEnv]}}
              - {required: [passwordEnv], not: {required: [username]}}
              - {required: [certFile], not: {required: [keyFile]}}
              - {required: [keyFile], not: {required: [certFile]}}
      properties:
        type: {type: string, enum: [file, http, mllp, database]}
        dir: {type: string, description: "file: absolute directory to poll"}
        pattern: {type: string, description: "file: file-name glob (default *)"}
        pollIntervalMs: {type: integer, minimum: 100, maximum: 3600000, description: "file: default 1000; database: at least 1000, default 5000"}
        schedule: {type: string, minLength: 1, description: "file, database: cron schedule instead of pollIntervalMs: minute hour day-of-month month day-of-week (*/15 7-19 * * MON-FRI), or @hourly, @daily, @every 30s; optionally CRON_TZ=Area/City first (default: the server's time zone)"}
        moveTo: {type: string, description: "file: absolute directory processed files are moved to (default: deleted)"}
        recursive: {type: boolean, description: "file: also read subdirectories of dir (default false)"}
        address: {type: string, description: "http, mllp: host:port the flow listens on while it is started"}
        path: {type: string, description: "http: request path accepted (default /)"}
        method: {type: string, enum: [POST, PUT], description: "http: request method accepted (default POST)"}
        username: {type: string, minLength: 1, pattern: "^[^:]+$", description: "http: HTTP Basic user name senders must present (with passwordEnv)"}
        passwordEnv: {type: string, pattern: "^WEAVSTER_SOURCE_[A-Z0-9_]+$", description: "http: server environment variable holding the Basic password, WEAVSTER_SOURCE_... (with username)"}
        certFile: {type: string, minLength: 1, description: "http, mllp: absolute path of the PEM certificate chain; the port serves HTTPS or MLLP over TLS only (with keyFile)"}
        readTimeoutMs: {type: integer, minimum: 1000, maximum: 600000, description: "http: time allowed to read one request (default 60000)"}
        keyFile: {type: string, minLength: 1, description: "http, mllp: absolute path of the PEM private key (with certFile)"}
        frameStart: {type: string, pattern: "^[0-9A-Fa-f]{2}$", description: "mllp: byte before each message, in hex (default 0B, MLLP's VT)"}
        frameEnd: {type: string, pattern: "^([0-9A-Fa-f]{2}){1,2}$", description: "mllp: one or two bytes after each message, in hex (default 1C0D, MLLP's FS CR)"}
        ackMode: {type: string, enum: [original, none], description: "mllp: original (default): answer each message with an HL7 ACK; none: send no reply"}
        driver: {type: string, enum: [postgres, sqlite], description: "database: postgres, or sqlite (a database file; for local use and tests)"}
        dsnEnv: {type: string, pattern: "^WEAVSTER_DB_[A-Z0-9_]+$", description: "database: server environment variable holding the connection string, WEAVSTER_DB_..."}
        query: {type: string, minLength: 1, description: "database: one SELECT (or WITH) statement run read-only every pollIntervalMs; each row becomes a message"}
        idColumn: {type: string, minLength: 1, description: "database: column of the result identifying a row (the update's key value; metadata source.database.id)"}
        update:
          type: object
          additionalProperties: false
          required: [table, key, set]
          description: "database: marks each row once its message is stored: UPDATE table SET … WHERE key = the row's id; the query must leave marked rows out"
          properties:
            table: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}(\\.[A-Za-z_][A-Za-z0-9_]{0,62})?$"}
            key: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"}
            set: {type: object, minProperties: 1, additionalProperties: {type: string}, description: "column -> value; column names are letters, digits, and _ (not starting with a digit), checked by the server and flow.schema.json"}
        maxRows: {type: integer, minimum: 1, maximum: 10000, description: "database: rows read per poll (default 100)"}
        timeoutMs: {type: integer, minimum: 1000, maximum: 120000, description: "database: time allowed for the query or one update (default 30000)"}
    FlowDestination:
      example: {"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}
      type: object
      required: [name, type]
      description: "url, method, and maxRedirects apply to http destinations; dir to file; address, tls, caFile, frameStart, frameEnd, and ackMode to mllp; driver, dsnEnv, table, columns (required), and keyColumn to database; flow (required) to flow; timeoutMs to http, mllp, and database."
      anyOf:
        - properties: {type: {enum: [http]}}
          not: {anyOf: [{required: [address]}, {required: [dir]}, {required: [flow]}, {required: [tls]}, {required: [caFile]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}, {required: [driver]}, {required: [dsnEnv]}, {required: [table]}, {required: [columns]}, {required: [keyColumn]}]}
        - properties: {type: {enum: [file]}}
          not: {anyOf: [{required: [method]}, {required: [timeoutMs]}, {required: [maxRedirects]}, {required: [address]}, {required: [flow]}, {required: [tls]}, {required: [caFile]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}, {required: [driver]}, {required: [dsnEnv]}, {required: [table]}, {required: [columns]}, {required: [keyColumn]}]}
        - properties: {type: {enum: [mllp]}}
          not:
            anyOf:
              - {required: [method]}
              - {required: [maxRedirects]}
              - {required: [url]}
              - {required: [dir]}
              - {required: [flow]}
              - {required: [driver]}
              - {required: [dsnEnv]}
              - {required: [table]}
              - {required: [columns]}
              - {required: [keyColumn]}
              - {required: [caFile], not: {required: [tls], properties: {tls: {enum: [true]}}}}
        - properties: {type: {enum: [database]}}
          required: [driver, dsnEnv, table, columns]
          not: {anyOf: [{required: [url]}, {required: [dir]}, {required: [address]}, {required: [flow]}, {required: [method]}, {required: [maxRedirects]}, {required: [tls]}, {required: [caFile]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}]}
        - properties: {type: {enum: [flow]}}
          required: [flow]
          not: {anyOf: [{required: [url]}, {required: [dir]}, {required: [address]}, {required: [method]}, {required: [timeoutMs]}, {required: [maxRedirects]}, {required: [tls]}, {required: [caFile]}, {required: [frameStart]}, {required: [frameEnd]}, {required: [ackMode]}, {required: [driver]}, {required: [dsnEnv]}, {required: [table]}, {required: [columns]}, {required: [keyColumn]}]}
      properties:
        name: {type: string}
        type: {type: string, enum: [file, http, mllp, flow, database]}
        url: {type: string}
        dir: {type: string}
        address: {type: string, description: "mllp: host:port to deliver HL7 v2 to"}
        tls: {type: boolean, description: "mllp: connect over TLS, verifying the receiver's certificate and host name (default false)"}
        caFile: {type: string, minLength: 1, description: "mllp with tls: absolute path of the PEM CA certificates trusted instead of the system's"}
        frameStart: {type: string, pattern: "^[0-9A-Fa-f]{2}$", description: "mllp: byte before each message, in hex (default 0B, MLLP's VT)"}
        frameEnd: {type: string, pattern: "^([0-9A-Fa-f]{2}){1,2}$", description: "mllp: one or two bytes after each message, in hex (default 1C0D, MLLP's FS CR)"}
        ackMode: {type: string, enum: [original, none], description: "mllp: original (default): wait for the receiver's HL7 ACK; none: delivered once written"}
        driver: {type: string, enum: [postgres, sqlite], description: "database: postgres, or sqlite (a database file; for local use and tests)"}
        dsnEnv: {type: string, pattern: "^WEAVSTER_DB_[A-Z0-9_]+$", description: "database: name of the server environment variable holding the connection string, WEAVSTER_DB_..."}
        table: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}(\\.[A-Za-z_][A-Za-z0-9_]{0,62})?$", description: "database: table (or schema.table) each message is inserted into"}
        columns: {type: object, minProperties: 1, additionalProperties: {type: string, minLength: 1}, description: "database: column name -> path of its value in the message (e.g. patient.mrn); a missing path is NULL"}
        keyColumn: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$", description: "database: column (with a unique constraint) that gets the delivery's idempotency key, so a retry inserts nothing"}
        flow: {type: string, description: "flow: id of the flow to hand messages to"}
        method: {type: string, enum: [POST, PUT, PATCH], description: "http: request method (default POST)"}
        timeoutMs: {type: integer, minimum: 1000, maximum: 120000, description: "http, mllp, database: time allowed for one delivery, including the response or ACK (default 30000)"}
        maxRedirects: {type: integer, minimum: 0, maximum: 10, description: "http: 307/308 redirects followed, never https to http (default 0: a redirect fails the delivery)"}
        transform: {description: A destination transform}
        responseTransform: {description: A response transform}
    Flow:
      example: {"id": "adt", "name": "ADT inbound", "sourceType": "http", "status": "started", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}
      type: object
      description: "A flow definition (agent-docs/schemas/flow.schema.json) with its runtime status."
      required: [id, name, sourceType, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        sourceType: {type: string}
        source: {$ref: "#/components/schemas/FlowSource"}
        status: {type: string, enum: [undeployed, deployed, started, paused, halted, stopped]}
        enabled: {type: boolean}
        initialState: {type: string, enum: [started, paused, stopped]}
        dependsOn: {type: array, items: {type: string}}
        stoppedDestinations: {type: array, items: {type: string}}
        transform: {description: The flow's transform}
        destinations: {type: array, items: {$ref: "#/components/schemas/FlowDestination"}}
        responseSelector: {type: string}
        inputFormat: {type: string, enum: [json, hl7v2, xml, delimited], description: "How transforms read a message: json (default), hl7v2 (the HL7 v2 message as JSON, e.g. PID.5.1), xml (the XML document as JSON, e.g. order.@id), or delimited (rows.0.<column>)"}
        delimited:
          type: object
          additionalProperties: false
          description: Options of inputFormat delimited
          properties:
            delimiter: {type: string, enum: [",", ";", "|", "\t"], description: "Field delimiter (default ,)"}
            header: {type: boolean, description: "Whether the first row names the columns (default true)"}
    UpdatedList:
      example: {"updated": ["adt", "lab"]}
      type: object
      required: [updated]
      properties:
        updated: {type: array, items: {type: string}}
    ConnectorNames:
      example: {"id": "adt", "name": "ADT inbound", "sourceType": "http", "destinations": ["ehr", "archive"]}
      type: object
      required: [id, name, sourceType, destinations]
      properties:
        id: {type: string}
        name: {type: string}
        sourceType: {type: string}
        destinations: {type: array, items: {type: string}}
    FlowBundle:
      example: {"version": 1, "flows": [{"id": "adt", "name": "ADT inbound", "sourceType": "http", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}]}
      type: object
      required: [version, flows]
      properties:
        version: {type: integer}
        flows: {type: array, items: {$ref: "#/components/schemas/Flow"}}
    FlowImportResult:
      example: {"created": ["lab"], "updated": ["adt"]}
      type: object
      required: [created, updated]
      properties:
        created: {type: array, items: {type: string}}
        updated: {type: array, items: {type: string}}
    SkippedFlow:
      example: {"id": "lab", "reason": "disabled"}
      type: object
      required: [id, reason]
      properties:
        id: {type: string}
        reason: {type: string}
    TransitionAllResult:
      example: {"changed": ["adt"], "skipped": [{"id": "lab", "reason": "disabled"}]}
      type: object
      required: [changed, skipped]
      properties:
        changed: {type: array, items: {type: string}}
        skipped: {type: array, items: {$ref: "#/components/schemas/SkippedFlow"}}
    PortInUse:
      example: {"address": "127.0.0.1:8080", "port": 8080, "usedBy": "api"}
      type: object
      required: [address, port, usedBy]
      properties:
        address: {type: string}
        port: {type: integer}
        usedBy: {type: string}
    ConnectorStats:
      example: {"sent": 39, "errored": 1}
      type: object
      required: [sent, errored]
      properties:
        sent: {type: integer}
        errored: {type: integer}
    FlowStats:
      example: {"received": 42, "filtered": 2, "transformed": 40, "sent": 39, "errored": 1, "queued": 0, "destinations": {"ehr": {"sent": 39, "errored": 1}, "archive": {"sent": 40, "errored": 0}}, "lastMessageAt": "2026-09-27T10:00:00Z"}
      type: object
      required: [received, filtered, transformed, sent, errored, queued, destinations]
      properties:
        received: {type: integer}
        filtered: {type: integer}
        transformed: {type: integer}
        sent: {type: integer}
        errored: {type: integer}
        queued: {type: integer}
        destinations: {type: object, additionalProperties: {$ref: "#/components/schemas/ConnectorStats"}}
        lastMessageAt: {type: string, format: date-time, description: Absent until the first message}
    FlowStatsMap:
      example: {"adt": {"received": 42, "filtered": 2, "transformed": 40, "sent": 39, "errored": 1, "queued": 0, "destinations": {"ehr": {"sent": 39, "errored": 1}, "archive": {"sent": 40, "errored": 0}}, "lastMessageAt": "2026-09-27T10:00:00Z"}}
      type: object
      description: Flow id -> statistics
      additionalProperties: {$ref: "#/components/schemas/FlowStats"}
    MessageAttempt:
      example: {"attempts": 3, "lastError": "Service Unavailable", "lastCode": "http:503", "lastAttemptAt": "2026-09-27T10:00:02Z", "nextAttemptAt": "2026-09-27T10:00:04Z"}
      type: object
      required: [attempts]
      properties:
        attempts: {type: integer}
        lastError: {type: string}
        lastCode: {type: string, description: "The last failure's protocol-specific code: http:<status>, mllp:AE/AR/CE/CR/no-ack/not-an-ack/wrong-message/unknown-code/ack-too-large, sqlstate:<code>, net:timeout/refused/reset/dns/connect, tls:certificate, flow:not-running/not-found; absent when it has none or after a success"}
        lastAttemptAt: {type: string, format: date-time, description: "When the last attempt ended"}
        nextAttemptAt: {type: string, format: date-time}
    Message:
      example: {"id": "7f3c9a1e", "flowId": "adt", "status": "sent", "contentType": "json", "receivedAt": "2026-09-27T10:00:00Z", "updatedAt": "2026-09-27T10:00:01Z", "attempts": {"ehr": {"attempts": 1}, "archive": {"attempts": 1}}, "metadata": {"source": "lab"}}
      type: object
      required: [id, flowId, status, contentType, receivedAt, updatedAt]
      properties:
        id: {type: string}
        flowId: {type: string}
        status: {type: string, enum: [received, transformed, queued, sent, filtered, errored, dead-lettered]}
        contentType: {type: string}
        receivedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        attempts: {type: object, additionalProperties: {$ref: "#/components/schemas/MessageAttempt"}, description: Destination name -> attempts}
        metadata: {type: object, additionalProperties: {type: string}}
    MessageImportResult:
      example: {"imported": 120, "skipped": 3, "busy": 0}
      type: object
      required: [imported, skipped, busy]
      properties:
        imported: {type: integer}
        skipped: {type: integer}
        busy: {type: integer}
    IngestResult:
      example: {"id": "7f3c9a1e", "status": "sent"}
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string, enum: [received, transformed, queued, sent, filtered, errored, dead-lettered]}
        response: {description: "The selected destination's reply, when the flow has a response selector and the reply is not empty or null"}
    TopologyActivity:
      example: {"received": 42, "sent": 39, "errored": 1, "queued": 0, "lastMessageAt": "2026-09-27T10:00:00Z"}
      type: object
      required: [received, sent, errored, queued]
      properties:
        received: {type: integer}
        sent: {type: integer}
        errored: {type: integer}
        queued: {type: integer}
        lastMessageAt: {type: string, format: date-time}
    TopologyNode:
      example: {"id": "flow:adt", "kind": "flow", "label": "ADT inbound", "status": "started", "activity": {"received": 42, "sent": 39, "errored": 1, "queued": 0, "lastMessageAt": "2026-09-27T10:00:00Z"}}
      type: object
      required: [id, kind, label]
      properties:
        id: {type: string}
        kind: {type: string, enum: [flow, source, transform, destination]}
        label: {type: string}
        status: {type: string, enum: [undeployed, deployed, started, paused, halted, stopped, errored], description: "Lifecycle state; errored when at least half of a started flow's (or destination's) deliveries in the last 5 minutes failed"}
        activity: {$ref: "#/components/schemas/TopologyActivity"}
        meta: {type: object, additionalProperties: {type: string}}
    TopologyEdge:
      example: {"id": "edge:flow:adt:dependency:flow:lab", "from": "flow:adt", "to": "flow:lab", "kind": "dependency"}
      type: object
      required: [id, from, to, kind]
      properties:
        id: {type: string}
        from: {type: string}
        to: {type: string}
        kind: {type: string, enum: [route, message-path, dependency]}
        label: {type: string}
        status: {type: string, enum: [active, idle, errored]}
        activity: {$ref: "#/components/schemas/TopologyActivity"}
    TopologyGraph:
      example: {"schemaVersion": "1", "generatedAt": "2026-09-27T10:00:00Z", "nodes": [{"id": "flow:adt", "kind": "flow", "label": "ADT inbound", "status": "started", "activity": {"received": 42, "sent": 39, "errored": 1, "queued": 0, "lastMessageAt": "2026-09-27T10:00:00Z"}}, {"id": "flow:lab", "kind": "flow", "label": "Lab results", "status": "started", "activity": {"received": 0, "sent": 0, "errored": 0, "queued": 0}}], "edges": [{"id": "edge:flow:adt:dependency:flow:lab", "from": "flow:adt", "to": "flow:lab", "kind": "dependency"}]}
      type: object
      required: [schemaVersion, generatedAt, nodes, edges]
      properties:
        schemaVersion: {type: string}
        generatedAt: {type: string, format: date-time}
        flowId: {type: string, description: "Drill-down only: flow:<id>"}
        flowName: {type: string}
        flowStatus: {type: string, enum: [undeployed, deployed, started, paused, halted, stopped, errored]}
        nodes: {type: array, items: {$ref: "#/components/schemas/TopologyNode"}}
        edges: {type: array, items: {$ref: "#/components/schemas/TopologyEdge"}}
    SystemStatus:
      example: {"id": "weavster", "status": "running", "version": "0.1.0", "time": "2026-09-27T10:00:00Z", "timezone": "UTC +00:00", "uptimeSeconds": 3600, "runtime": "go1.22", "tls": {"enabled": true, "address": "0.0.0.0:8443", "minVersion": "1.3", "protocols": ["TLS 1.3"], "ciphers": ["TLS_AES_128_GCM_SHA256", "TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]}}
      type: object
      required: [id, status, version, time, uptimeSeconds, tls]
      properties:
        id: {type: string}
        status: {type: string, enum: [running]}
        version: {type: string}
        buildDate: {type: string}
        time: {type: string, format: date-time}
        timezone: {type: string}
        uptimeSeconds: {type: integer}
        runtime: {type: string}
        charsets: {type: array, items: {type: string}}
        tls:
          type: object
          required: [enabled, protocols, ciphers]
          properties:
            enabled: {type: boolean}
            address: {type: string}
            minVersion: {type: string, enum: ["1.2", "1.3"]}
            protocols: {type: array, items: {type: string}}
            ciphers: {type: array, items: {type: string}}
        license: {type: string}
    SystemAbout:
      example: {"name": "Weavster", "version": "0.1.0", "runtime": "go1.22", "os": "linux", "arch": "amd64"}
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        buildDate: {type: string}
        runtime: {type: string}
        os: {type: string}
        arch: {type: string}
        license: {type: string}
    PasswordRequirements:
      example: {"minLength": 8, "minUpper": 1, "minLower": 1, "minNumeric": 1, "minSpecial": 0, "rules": ["at least 8 characters", "at least 1 uppercase letter", "at least 1 lowercase letter", "at least 1 digit"]}
      type: object
      properties:
        minLength: {type: integer}
        minUpper: {type: integer}
        minLower: {type: integer}
        minNumeric: {type: integer}
        minSpecial: {type: integer}
        rules: {type: array, items: {type: string}}
    SystemResources:
      example: {"cpus": 4, "goroutines": 42, "memoryAllocBytes": 18874368, "memorySysBytes": 33554432, "uptimeSeconds": 3600}
      type: object
      properties:
        cpus: {type: integer}
        goroutines: {type: integer}
        memoryAllocBytes: {type: integer}
        memorySysBytes: {type: integer}
        uptimeSeconds: {type: integer}
    Event:
      example: {"id": 1287, "at": "2026-09-27T10:00:00Z", "type": "message.sent", "flowId": "adt", "data": {"messageId": "7f3c9a1e"}}
      type: object
      required: [id, at, type]
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        type: {type: string, description: "For example message.sent, message.errored, flow.deployed"}
        flowId: {type: string}
        data: {type: object, additionalProperties: {type: string}}
    ConfigPlan:
      example: {"fingerprint": "3f9b1c7e0d4a2f6b8c5e1a9d7b3f0c2e4a6d8b1f3c5e7a9b0d2f4c6e8a1b3d5f", "added": ["script/deploy"], "updated": ["flow/adt"], "removed": [], "unchanged": 7, "changes": [{"key": "script/deploy", "action": "add", "after": "log()"}, {"key": "flow/adt", "action": "update", "fields": [{"path": "destinations[0].url", "before": "https://old.example.com/in", "after": "https://ehr.example.com/in"}]}], "text": "+ script/deploy\n~ flow/adt\n    destinations[0].url: \"https://old.example.com/in\" → \"https://ehr.example.com/in\"\n1 to add, 1 to change, 0 to remove, 7 unchanged\n"}
      type: object
      required: [fingerprint, added, updated, removed, unchanged, changes, text]
      properties:
        fingerprint: {type: string, description: Identifies the live configuration the plan was made against}
        added: {type: array, items: {type: string}, description: "Artifact keys such as flow/adt, alert/errors, configmap/region"}
        updated: {type: array, items: {type: string}}
        removed: {type: array, items: {type: string}}
        unchanged: {type: integer}
        changes:
          type: array
          items:
            type: object
            required: [key, action]
            properties:
              key: {type: string}
              action: {type: string, enum: [add, update, remove]}
              before: {description: The live artifact (update and remove)}
              after: {description: The document's artifact (add and update)}
              fields:
                type: array
                items:
                  type: object
                  required: [path]
                  properties:
                    path: {type: string, description: "For example destinations[0].url; value for a text or setting"}
                    before: {}
                    after: {}
        text: {type: string, description: "The plan for people: + add, ~ change (with one line per field), - remove"}
    ConfigValidation:
      example: {"valid": true, "counts": {"flows": 1, "alerts": 1, "snippets": 0, "snippetLibraries": 0, "scripts": 1, "configmap": 0, "settings": 1}}
      type: object
      required: [valid, counts]
      properties:
        valid: {type: boolean}
        counts:
          type: object
          properties:
            flows: {type: integer}
            alerts: {type: integer}
            snippets: {type: integer}
            snippetLibraries: {type: integer}
            scripts: {type: integer}
            configmap: {type: integer}
            settings: {type: integer}
    ConfigBundle:
      example: {"format": "weavster-config-v1", "flows": [{"id": "adt", "name": "ADT inbound", "sourceType": "http", "enabled": true, "destinations": [{"name": "ehr", "type": "http", "url": "https://ehr.example.com/in"}, {"name": "archive", "type": "file", "dir": "/var/lib/weavster/out/adt"}]}], "alerts": [{"id": "errors", "name": "Errors on ADT", "enabled": true, "trigger": {"events": ["message.errored", "message.dead-lettered"], "flows": ["adt"]}, "actions": [{"type": "email", "to": ["ops@example.com"]}]}], "snippets": [], "snippetLibraries": [], "scripts": {"deploy": "log()"}, "settings": {"retention": {"days": 30}}}
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: {type: string, enum: [weavster-config-v1]}
        flows: {type: array, items: {type: object}, description: Flow definitions as in a flow export}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        snippets: {type: array, items: {$ref: "#/components/schemas/Snippet"}}
        snippetLibraries: {type: array, items: {$ref: "#/components/schemas/SnippetLibrary"}}
        scripts: {type: object, additionalProperties: {type: string}}
        settings: {type: object}
        configmap: {type: object, additionalProperties: {type: string}}
    ConfigImportResult:
      example: {"flows": {"created": ["adt"], "updated": []}, "alerts": 1, "snippets": 0, "snippetLibraries": 0, "scripts": 1, "settings": 1, "configMapReplaced": false, "deployed": ["adt"]}
      type: object
      properties:
        flows: {type: object, properties: {created: {type: array, items: {type: string}}, updated: {type: array, items: {type: string}}}}
        alerts: {type: integer}
        snippets: {type: integer}
        snippetLibraries: {type: integer}
        scripts: {type: integer}
        settings: {type: integer}
        configMapReplaced: {type: boolean}
        deployed: {type: array, items: {type: string}}
    AlertTrigger:
      example: {"events": ["message.errored", "message.dead-lettered"], "flows": ["adt"]}
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: {type: array, minItems: 1, items: {type: string, enum: [message.errored, message.queued, message.dead-lettered]}}
        flows: {type: array, items: {type: string}, description: Flow ids; none means every flow}
    AlertAction:
      example: {"type": "email", "to": ["ops@example.com"]}
      oneOf:
        - {$ref: "#/components/schemas/AlertEmailAction"}
        - {$ref: "#/components/schemas/AlertWebhookAction"}
    AlertEmailAction:
      example: {"type": "email", "to": ["ops@example.com"]}
      type: object
      additionalProperties: false
      required: [type, to]
      properties:
        type: {type: string, enum: [email]}
        to: {type: array, minItems: 1, items: {type: string, format: email}, description: "Plain email addresses, no display names"}
    AlertWebhookAction:
      example: {"type": "webhook", "url": "https://hooks.example.com/weavster"}
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: {type: string, enum: [webhook]}
        url: {type: string, format: uri, description: "http or https URL without a user name or password"}
    Alert:
      example: {"id": "errors", "name": "Errors on ADT", "enabled": true, "trigger": {"events": ["message.errored", "message.dead-lettered"], "flows": ["adt"]}, "actions": [{"type": "email", "to": ["ops@example.com"]}]}
      type: object
      additionalProperties: false
      required: [id, name, trigger, actions]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$", description: "Not import, options, or statuses"}
        name: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        trigger: {$ref: "#/components/schemas/AlertTrigger"}
        actions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AlertAction"}}
    AlertUpdate:
      example: {"name": "Errors on ADT", "enabled": true, "trigger": {"events": ["message.errored", "message.dead-lettered"], "flows": ["adt"]}, "actions": [{"type": "email", "to": ["ops@example.com"]}]}
      type: object
      additionalProperties: false
      description: "An alert for PUT on /api/v1/alerts/{name}: id is optional and must match the path"
      required: [name, trigger, actions]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$", description: "Not import, options, or statuses"}
        name: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        trigger: {$ref: "#/components/schemas/AlertTrigger"}
        actions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AlertAction"}}
    AuditEntry:
      example: {"id": 412, "at": "2026-09-28T12:03:11.204Z", "actor": "alice", "action": "phi.access", "resource": "/api/v1/messages", "detail": {"messages": "1", "messages.ids": "[\"6f1c9e\"]", "status": "200"}}
      type: object
      required: [id, at, actor, action, resource, detail]
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        resource: {type: string}
        detail: {type: object, additionalProperties: {type: string}}
    PruneStatus:
      example: {"maxAgeHours": 720, "maxMessages": 0, "auditMaxAgeDays": 365, "eventMaxAgeDays": 90, "intervalMinutes": 60, "running": false, "nextRunAt": "2026-09-28T13:00:00Z", "lastRun": {"startedAt": "2026-09-28T12:00:00Z", "finishedAt": "2026-09-28T12:00:02Z", "removed": 1250, "busy": 0, "auditRemoved": 310, "eventsRemoved": 1200, "stopped": false}}
      type: object
      required: [maxAgeHours, maxMessages, auditMaxAgeDays, eventMaxAgeDays, intervalMinutes, running]
      properties:
        maxAgeHours: {type: integer, description: "prune.maxAgeHours (0 = off)"}
        maxMessages: {type: integer, description: "prune.maxMessages (0 = off)"}
        auditMaxAgeDays: {type: integer, description: "prune.auditMaxAgeDays (0 = keep the audit log)"}
        eventMaxAgeDays: {type: integer, description: "prune.eventMaxAgeDays (0 = keep stored events)"}
        intervalMinutes: {type: integer}
        running: {type: boolean}
        nextRunAt: {type: string, format: date-time, description: The next scheduled pass (absent when pruning is off)}
        lastRun:
          type: object
          required: [startedAt, removed, busy, auditRemoved, eventsRemoved, stopped]
          properties:
            startedAt: {type: string, format: date-time}
            finishedAt: {type: string, format: date-time, description: Absent while the pass runs}
            removed: {type: integer}
            busy: {type: integer, description: Messages skipped because they were being processed}
            auditRemoved: {type: integer, description: Audit entries removed (prune.auditMaxAgeDays)}
            eventsRemoved: {type: integer, description: Stored events removed (prune.eventMaxAgeDays)}
            stopped: {type: boolean}
            error: {type: string}
    MessagesDeleted:
      example: {"deleted": 250, "busy": 1, "restarted": ["adt"]}
      type: object
      required: [deleted, busy, restarted]
      properties:
        deleted: {type: integer}
        busy: {type: integer, description: Matches left alone because they were being processed}
        restarted: {type: array, items: {type: string}, description: Flows stopped for the removal and started again}
    SnippetUpdate:
      example: {"code": "pid.3 = upper(pid.3)"}
      type: object
      additionalProperties: false
      description: "A snippet for PUT on /api/v1/snippets/{name}: name is optional and must match the path"
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
        library: {type: string, description: "Name of an existing snippet library"}
        description: {type: string}
        code: {type: string}
    SnippetLibraryUpdate:
      example: {"name": "hl7"}
      type: object
      additionalProperties: false
      description: "A library for PUT on /api/v1/snippet-libraries/{name}: name is optional and must match the path"
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
        description: {type: string}
    Snippet:
      example: {"name": "pid", "library": "hl7", "code": "pid.3 = upper(pid.3)"}
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
        library: {type: string, description: "Name of an existing snippet library"}
        description: {type: string}
        code: {type: string}
    SnippetLibrary:
      example: {"name": "hl7"}
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
        description: {type: string}
    UserInfo:
      example: {"username": "ops", "email": "ops@example.com", "org": "Integration", "permissions": ["flows:view", "messages:view"], "mustChangePassword": false, "locked": false}
      type: object
      required: [username, permissions, mustChangePassword, locked]
      properties:
        username: {type: string}
        email: {type: string}
        org: {type: string}
        permissions: {type: array, items: {type: string}}
        mustChangePassword: {type: boolean}
        locked: {type: boolean}
    NewUser:
      example: {"username": "ops", "password": "A-Strong-Passw0rd", "email": "ops@example.com", "permissions": ["flows:view", "messages:view"]}
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, pattern: "^[A-Za-z0-9._@-]{1,64}$"}
        password: {type: string, writeOnly: true}
        email: {type: string}
        org: {type: string}
        permissions: {type: array, items: {type: string}, description: "From the documented permission set; default none"}
        mustChangePassword: {type: boolean, default: true}
    UserUpdate:
      example: {"permissions": ["flows:view", "messages:view", "messages:send"], "org": "Integration"}
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions: {type: array, items: {type: string}}
        email: {type: string, description: Kept when omitted}
        org: {type: string, description: Kept when omitted}
    Preferences:
      type: object
      description: "Up to 100 preferences; names are 1-100 characters, values text of at most 4096 bytes"
      maxProperties: 100
      additionalProperties: {type: string, maxLength: 4096}
      example: {"theme": "dark", "dashboard.flow": "adt"}
    PasswordSet:
      example: {"password": "A-New-Passw0rd"}
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, writeOnly: true}
    Error:
      example: {"error": {"code": "NOT_FOUND", "message": "flow not found"}}
      type: object
      description: "Every error reply (see docs/api-errors.md)."
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: "Stable code, e.g. NOT_FOUND, CONFLICT, NOT_IMPLEMENTED"}
            message: {type: string}
  headers:
    WeavsterAPIVersion:
      description: The API version that answered (every /api/v1 and unversioned /api reply).
      schema: {type: string, example: v1}
  responses:
    Error:
      description: Error envelope
      headers:
        Weavster-API-Version: {$ref: "#/components/headers/WeavsterAPIVersion"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
