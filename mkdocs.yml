site_name: Weavster
site_description: Config-driven, message-oriented integration platform
site_url: https://docs.weavster.dev/
repo_url: https://github.com/weavster-dev/weavster
repo_name: weavster-dev/weavster
docs_dir: docs

# 'Edit on GitHub' link target (default branch is 'main', not 'master').
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Install, Upgrade, Roll Back: install.md
  - Support Matrix: support-matrix.md
  - Server Configuration: server-config.md
  - Production Setup: production.md
  - Local Development with Docker Compose: docker-compose.md
  - Capacity and Limits: limits.md
  - Authentication: authentication.md
  - Metrics: metrics.md
  - Command-line client: cli.md
  - REST API: api.md
  - API errors: api-errors.md
  - Audit Log: audit-log.md
  - Processing Messages: processing-messages.md
  - Topology: topology.md
  - Web UI: web-ui.md
  - Flow Lifecycle: flow-lifecycle.md
  - Flow Dependencies, Export, Import: flow-export-import.md
  - Config Map, Scripts, Settings: config-items.md
  - Code Snippets: snippets.md
  - Alerts: alerts.md
  - Dynamic Lookups: lookups.md
  - Configuration Export and Import: config-transfer.md
  - Config-as-Code Documents: config-as-code.md
  - CI/CD: ci-cd.md
  - System Information: system-info.md
  - JSON and XML: api-formats.md
  - Docs Site Guide: documentation.md

# Internal build-loop prompt is not part of the public docs site.
exclude_docs: |
  prompt-3-kickoff.md
  mvp-project-plan.md
  agent-onboarding.md

# Every build is strict: a warning (a broken link between pages, a missing
# anchor, a page outside the nav) fails it. Links to files outside docs/
# are full GitHub URLs, which MkDocs does not check.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  links:
    not_found: warn
