site_name: Weavster
site_description: Config-driven, message-oriented integration platform
site_url: https://docs.weavster.dev/
repo_url: https://github.com/weavster-dev/weavster
repo_name: weavster-dev/weavster
docs_dir: docs

# 'Edit on GitHub' link target (default branch is 'main', not 'master').
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - MVP Project Plan: mvp-project-plan.md
  - Agent Onboarding: agent-onboarding.md

# Internal build-loop prompt is not part of the public docs site.
exclude_docs: |
  prompt-3-kickoff.md

# Specs/manifest/AGENTS links live outside docs/; don't fail the build on them.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
