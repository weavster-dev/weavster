openapi: 3.1.0
info:
  title: Weavster API
  version: 0.1.0
  description: >
    REST API for the Weavster message-oriented integration platform.
    JSON-first; the read-only topology graph is the confirmed MVP UI surface.
  license:
    name: Business Source License 1.1
servers:
  - url: https://localhost:8443
    description: Local HTTPS (production requires TLS)
security:
  - BasicAuth: []
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Credentials must only be sent over TLS.
paths:
  /api/v1/system:
    get:
      summary: System status
      security:
        - BasicAuth: []
      responses:
        "200":
          description: System information (id, version, build date, runtime, charsets, protocols/ciphers, license).
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /api/v1/topology:
    get:
      summary: Flow topology overview graph (read-only)
      security:
        - BasicAuth: []
      responses:
        "200":
          description: Overview graph (flow nodes + route/dependency edges).
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /api/v1/topology/flows/{flowId}:
    get:
      summary: Flow-internal topology graph (read-only)
      security:
        - BasicAuth: []
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow-internal graph (source -> transform -> destination nodes + message-path edges).
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /api/v1/flows:
    get:
      summary: List flows
      security:
        - BasicAuth: []
      responses:
        "200":
          description: Flow list.
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
    post:
      summary: Create flow
      security:
        - BasicAuth: []
      responses:
        "201":
          description: Created.
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /api/v1/flows/{id}:
    get:
      summary: Get flow
      security:
        - BasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow record.
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
    delete:
      summary: Delete flow
      security:
        - BasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /api/v1/messages:
    get:
      summary: Search messages
      security:
        - BasicAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: flowId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Message search results.
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions