openapi: 3.1.0
info:
  title: Weavster API
  version: 0.1.0
  description: >
    REST API for the Weavster message-oriented integration platform.
    JSON-first; the read-only topology graph is the confirmed MVP UI surface.
paths:
  /api/v1/auth/login:
    post:
      summary: Log in and receive a bearer token (valid 12 hours)
      security:
        - csrfMarker: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
                mfaCode: {type: string}
      responses:
        "200": {description: "Token, expiresAt, and user"}
        "401": {description: Invalid username or password}
  /api/v1/auth/logout:
    post:
      summary: Revoke the bearer token used for this request
      responses:
        "204": {description: Logged out}
  /api/v1/auth/me:
    get:
      summary: Current user, permissions, and whether a password change is required
      responses:
        "200": {description: Current user}
  /api/v1/auth/password:
    post:
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: {type: string}
                newPassword: {type: string}
      responses:
        "204": {description: Password changed}
        "400": {description: New password rejected by the password policy}
  /api/v1/system:
    get:
      summary: System status
      responses:
        "200":
          description: System information (id, version, build date, runtime, charsets, protocols/ciphers, license).
  /api/v1/topology:
    get:
      summary: Flow topology overview graph (read-only)
      responses:
        "200":
          description: Overview graph (flow nodes + route/dependency edges).
  /api/v1/topology/flows/{flowId}:
    get:
      summary: Flow-internal topology graph (read-only)
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow-internal graph (source -> transform -> destination nodes + message-path edges).
  /api/v1/flows:
    get:
      summary: List flows
      responses:
        "200":
          description: Flow list.
    post:
      summary: Create flow
      responses:
        "201":
          description: Created.
  /api/v1/flows/{id}:
    get:
      summary: Get flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flow record.
    delete:
      summary: Delete flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
  /api/v1/flows/{id}/messages:
    post:
      summary: Send a message into a flow (requires messages:send)
      description: >
        Persists the message, runs the flow's transform, and delivers it to each destination.
        The body must be a JSON object when the flow has a transform.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "202": {description: "Processed: {id, status} with status sent, queued, filtered, or errored"}
        "400": {description: Body is not a JSON object}
        "404": {description: Unknown flow}
        "413": {description: Body larger than 10 MiB}
  /api/v1/messages:
    get:
      summary: Search messages
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: flowId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Message search results.
security:
  - basicAuth: []
    csrfMarker: []
  - bearerAuth: []
    csrfMarker: []
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic}
    bearerAuth: {type: http, scheme: bearer}
    csrfMarker: {type: apiKey, in: header, name: X-Weavster-CSRF}
