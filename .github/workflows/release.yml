name: release

# A version tag (v1.2.0, or v1.2.0-rc.1 for a pre-release) publishes a
# GitHub release: a static binary archive for linux/amd64, linux/arm64, and
# darwin/arm64, and a SHA-256 checksums file (D-55: no signing yet).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build the archives and checksums
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Verify the checksums and the version
        working-directory: dist
        run: |
          sha256sum -c weavster_*_checksums.txt
          tar -xzf "weavster_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz"
          "./weavster_${GITHUB_REF_NAME#v}_linux_amd64/weavster" version | grep -q "^weavster ${GITHUB_REF_NAME#v} "
          rm -rf "weavster_${GITHUB_REF_NAME#v}_linux_amd64"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Weavster $GITHUB_REF_NAME" "${prerelease[@]}"
