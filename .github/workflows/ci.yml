name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  postgres:
    # The store, the database adapters, and the server against PostgreSQL 16
    # (D-21, D-55): tests use WEAVSTER_TEST_POSTGRES_DSN, a fresh schema each.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weavster
          POSTGRES_PASSWORD: weavster
          POSTGRES_DB: weavster
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U weavster"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WEAVSTER_TEST_POSTGRES_DSN: postgres://weavster:weavster@127.0.0.1:5432/weavster?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test against PostgreSQL 16
        run: go test -race ./internal/state/... ./internal/adapters/... ./internal/scheduler/... ./cmd/weavster/...

  golden:
    # The golden-path fixtures for each codec, run offline by the built
    # binary as a user's CI would; the JUnit results are kept as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -o bin/weavster ./cmd/weavster
      - name: weavster test
        run: bin/weavster test --format junit --output artifacts/ examples/
      - name: Keep the JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weavster-test-junit
          path: artifacts/results.xml

  release:
    # The release build (scripts/release.sh, as the release workflow runs it
    # on a tag): archives and checksums for every target, verified, and the
    # stamped version reported by the binary. Nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build the archives and checksums
        run: scripts/release.sh 0.0.0-ci dist
      - name: Verify the archives
        run: scripts/verify-release.sh 0.0.0-ci dist

  docs:
    # The documentation site builds with --strict (warnings fail) on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mkdocs
        run: pip install -r requirements.txt
      - name: Build the docs
        run: mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
      - name: No lint suppressions
        run: |
          if grep -rn --include='*.go' '//nolint' .; then
            echo "::error::remove //nolint directives; fix the finding instead"
            exit 1
          fi

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -o weavster ./cmd/weavster
      - name: Verify no CGo
        run: go version -m weavster | grep -q 'CGO_ENABLED=0'
      - name: Verify static linking (linux)
        if: matrix.target.goos == 'linux'
        run: file weavster | tee /dev/stderr | grep -q 'statically linked'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t weavster:ci .
      - name: Verify non-root user
        run: test "$(docker inspect --format '{{.Config.User}}' weavster:ci)" = "nonroot:nonroot"
      - name: Smoke test
        run: |
          docker run -d --name weavster -p 8080:8080 weavster:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/openapi.yaml | grep -q '^openapi:'; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          docker logs weavster
          exit 1

  compose:
    # docker-compose.yml: the server with PostgreSQL 16 for local development.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the compose stack
        run: scripts/compose-smoke.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Getting started (docs/getting-started.md, against the stack)
        run: scripts/getting-started.sh
      - name: Server logs
        if: failure()
        run: docker compose logs
      - name: Remove the stack
        if: always()
        run: docker compose down -v
